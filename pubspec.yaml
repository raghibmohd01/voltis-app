name: inverter_dashboard
description: Real-time Flutter dashboard for an ESP32 solar inverter telemetry monitor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_local_notifications: ^18.0.0
  workmanager: ^0.10.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#080B10"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
